<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinder</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14100f;color:#f2ead8;font:16px system-ui,sans-serif;text-align:center;padding:24px}a{color:#f2d39b}</style></head>
<body><div><h1>Cinder</h1><p>No hay conexión a internet. Cinder necesita internet para funcionar.</p><p id="state">Se volverá a intentar sola en cuanto haya conexión.</p><p><a href="https://ivanminguezdelabanda-source.github.io/peli-match/">Reintentar ahora</a></p></div>
<script>
  // Sin conexión al abrir: se reintenta sola cada pocos segundos y al volver la red
  var URL_CINDER = "https://ivanminguezdelabanda-source.github.io/peli-match/";
  function retry() {
    fetch(URL_CINDER, { method: "HEAD", cache: "no-store" }).then(function () { location.href = URL_CINDER; }).catch(function () {});
  }
  window.addEventListener("online", retry);
  setInterval(retry, 4000);
</script></body></html>
