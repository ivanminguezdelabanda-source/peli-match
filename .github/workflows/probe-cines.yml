name: probe cines
on: { push: { branches: [probe-cines] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          get(){ curl -sSL -m 30 -A "$UA" -H "Accept-Language: es-ES" -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> codes.txt || echo "$1 FAIL" >> codes.txt; }
          get fa-m.html "https://www.filmaffinity.com/es/theaters.php?state=ES-M"
          get fa-235.html "https://www.filmaffinity.com/es/theater-showtimes.php?id=235"
          get fa-robots.txt "https://www.filmaffinity.com/robots.txt"
          get sc-E0284.html "https://www.sensacine.com/cines/cine/E0284/"
          get sc-robots.txt "https://www.sensacine.com/robots.txt"
          get ph.json "https://photon.komoot.io/api/?q=calle%20mayor%2010&limit=5&bbox=-18.2,27.6,4.4,43.9"
          cat codes.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm probe; git push -q origin HEAD:probe-cines
