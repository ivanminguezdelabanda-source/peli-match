name: probe cines 2
on: { push: { branches: [probe-cines2] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          curl -sS -m 30 -D h1.txt -o it1.json "https://itunes.apple.com/search?term=el%20caballero%20oscuro&country=es&media=movie&entity=movie&limit=5"
          curl -sS -m 30 -H "Origin: https://ivanminguezdelabanda-source.github.io" -D h2.txt -o it2.txt "https://itunes.apple.com/search?term=origen&country=es&media=movie&entity=movie&limit=5&callback=cb"
          head -c 300 it2.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm probe; git push -q origin HEAD:probe-cines2
