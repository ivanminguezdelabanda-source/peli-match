name: probe cines 2
on: { push: { branches: [probe-cines2] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          curl -sS -m 30 -o q0.json "https://itunes.apple.com/search?term=batman&country=es&media=movie&limit=3"; sleep 3
          curl -sS -m 30 -o q1.json "https://itunes.apple.com/search?term=the%20dark%20knight&country=es&media=movie&entity=movie&limit=3"; sleep 3
          curl -sS -m 30 -o q2.json "https://itunes.apple.com/search?term=dune&country=es&media=movie&entity=movie&lang=es_es&limit=3"; sleep 3
          curl -sS -m 30 -o q3.json "https://itunes.apple.com/search?term=dune&country=us&media=movie&entity=movie&limit=3"; sleep 3
          curl -sS -m 30 -o q4.json "https://itunes.apple.com/search?term=oppenheimer&country=es&entity=movie&limit=3"; sleep 3
          curl -sS -m 30 -o q5.json "https://itunes.apple.com/search?term=origen&country=es&media=movie&attribute=movieTerm&limit=3"; sleep 3
          for f in q*.json; do echo $f; head -c 200 $f; done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm probe; git push -q origin HEAD:probe-cines2
