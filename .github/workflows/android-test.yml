# Prueba la app de Android en emuladores (varios tamaños, versiones y letra del sistema) y guarda capturas e informe
# en la rama android-test-results. Se lanza a mano desde Actions o al cambiar la prueba.
name: Probar la app de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/test/**", ".github/workflows/android-test.yml"]

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api35-pixel6, api: 35, profile: pixel_6, font: "1.0" }
          - { name: api34-pixel6-letra-grande, api: 34, profile: pixel_6, font: "1.3" }
          - { name: api30-pequeno, api: 30, profile: Nexus 5X, font: "1.0" }
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK de depuración
        run: |
          npm ci
          npm install --no-save playwright@1
          npx cap sync android
          cd android && chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > build.log 2>&1 || { tail -30 build.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk
      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android-app
          script: node test/emulator.mjs ${{ matrix.name }} ${{ matrix.font }} || true
      - name: Resumen
        if: always()
        run: |
          f="results/${{ matrix.name }}/report.json"
          if [ -f "$f" ]; then
            node -e 'const r=require("./'"$f"'");console.log(`::notice::${r.name}: ${r.steps.length} pasos, ${r.errors.length} errores`);r.errors.slice(0,5).forEach(e=>console.log("::error::"+e.slice(0,300)))'
          else echo "::error::Sin informe"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: android-app/results

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Subir capturas a la rama android-test-results
        run: |
          cd results
          git init -q -b android-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Resultados de la prueba en Android (${GITHUB_SHA::8})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-test-results
