name: Sincronizar TMDB y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *" # cada día a las 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[datos]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar pelis de TMDB
        if: github.event_name != 'push'
        run: node scripts/sync-tmdb.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Guardar datos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --cached --quiet || (git commit -m "Actualizar catálogo de TMDB [datos]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
