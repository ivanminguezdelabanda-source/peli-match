name: Sincronizar TMDB y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *" # cada día a las 04:00 UTC: catálogo completo y novedades
    - cron: "0 10,16,22 * * *" # tres veces más al día: solo novedades y noticias
  workflow_dispatch:
    inputs:
      catalogo:
        description: "Descargar también el catálogo completo (tarda bastante)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[datos]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Siempre la última versión de main, para no publicar datos viejos si se cruzan dos ejecuciones
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar pelis de TMDB
        if: (github.event_name == 'workflow_dispatch' && inputs.catalogo) || github.event.schedule == '0 4 * * *'
        run: node scripts/sync-tmdb.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Descargar novedades y noticias
        if: github.event_name != 'push'
        continue-on-error: true # si falla, se publica con las novedades anteriores
        run: node scripts/sync-news.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Guardar datos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          # main puede haber avanzado mientras se descargaba el catálogo (tarda): se suben los datos encima
          git diff --cached --quiet || (git commit -m "Actualizar catálogo de TMDB [datos]" && git pull --rebase -q origin main && git push)
      # IA de «Para ti»: solo si están los secretos ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
      - name: Comprobar si la IA está configurada
        id: hasia
        run: echo "on=${{ secrets.ANTHROPIC_API_KEY != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Instalar el Worker de la IA
        if: steps.hasia.outputs.on == 'true'
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Publicar el Worker de la IA en Cloudflare
        id: ia
        if: steps.hasia.outputs.on == 'true'
        continue-on-error: true # si falla, la web se publica igual con el recomendador local
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Conectar la app con la IA
        if: steps.ia.outcome == 'success' && steps.ia.outputs.deployment-url != ''
        run: printf 'window.PELIMATCH_AI_URL = "%s";\n' "$URL" > js/config.js && cat js/config.js
        env:
          URL: ${{ steps.ia.outputs.deployment-url }}
      # Traduce el JS y el CSS a una versión que entienden también los móviles antiguos
      # (WebView de Android 8-11 sin actualizar, iPhone con iOS 12-13). El código del repositorio no cambia.
      - name: Compatibilidad con navegadores antiguos
        run: |
          npx -y esbuild@0.24.2 js/app.js js/cloud.js js/taste.js --target=chrome69,safari12,firefox68 --outdir=js --allow-overwrite --log-level=warning
          npx -y esbuild@0.24.2 styles.css --target=chrome69,safari12,firefox68 --outfile=styles.css --allow-overwrite --log-level=warning
      # Cada publicación pide CSS y JS nuevos, para que el navegador no mezcle versiones
      - name: Marcar la versión de los archivos
        run: echo "${GITHUB_SHA::8}" > version.txt && sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html accion.html terminos.html login-app.html privacidad.html borrar-cuenta.html js/app.js
      - name: No publicar las dependencias del Worker ni el proyecto de Android
        run: rm -rf worker/node_modules android-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
