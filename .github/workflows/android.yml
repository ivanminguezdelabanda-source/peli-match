# Genera la APK de Android de Cinder (android-app/, Capacitor) y la publica en las releases de GitHub.
# La app abre la web publicada, así que los cambios de la web llegan a la app sin hacer otra APK.
# Solo hace falta una APK nueva si cambia algo de android-app/ (icono, nombre, permisos…).
# También genera cinder.aab, el archivo que se sube a Google Play (necesita la clave fija de los secretos).
# Descarga: https://github.com/ivanminguezdelabanda-source/peli-match/releases/latest/download/cinder.apk
name: APK de Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", "!android-app/test/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar el proyecto de Android
        run: |
          echo "Android SDK: $ANDROID_HOME"
          npm ci
          npx cap sync android

      # Firma: si existen los secretos ANDROID_KEYSTORE (el .jks en base64) y ANDROID_KEYSTORE_PASSWORD se usan
      # siempre los mismos y cada APK nueva se instala encima de la anterior. Si no existen, se crea una clave nueva
      # en cada compilación: la APK funciona igual, pero para actualizarla hay que desinstalar la anterior
      # (no se pierde nada: los datos están en la cuenta).
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/cinder.jks
            pw="$KEYSTORE_PW"
          else
            pw="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore android/app/cinder.jks -storetype PKCS12 -alias cinder -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pw" -keypass "$pw" -dname "CN=Cinder, O=Cinder TFG, C=ES"
            echo "::warning::APK firmada con una clave nueva (no hay secreto ANDROID_KEYSTORE): para actualizar hay que desinstalar la anterior."
          fi
          echo "::add-mask::$pw"
          echo "KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Compilar la APK y el AAB de Play Store
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          # Si falla, las últimas líneas salen como aviso en el resumen del workflow
          ./gradlew --no-daemon assembleRelease bundleRelease > build.log 2>&1 || { grep -E "error|FAILURE|wrong|What went" build.log | tail -15 | while read -r l; do echo "::error::$l"; done; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../cinder.apk
          # El AAB es el formato que pide Google Play (la APK es para instalarla a mano)
          cp app/build/outputs/bundle/release/app-release.aab ../cinder.aab

      - name: Publicar en las releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-1.${{ github.run_number }}"
          gh release create "$tag" cinder.apk cinder.aab --latest --target "$GITHUB_SHA" \
            --title "Cinder para Android 1.${{ github.run_number }}" \
            --notes "Descarga **cinder.apk** e instálala en tu Android (tendrás que permitir instalar apps de fuentes desconocidas). La app abre Cinder y se actualiza sola con la web; tu cuenta es la misma."
          echo "::notice::APK publicada: https://github.com/${{ github.repository }}/releases/latest/download/cinder.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-apk
          path: |
            android-app/cinder.apk
            android-app/cinder.aab
